name: Build Agent APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK. The old
      # android-actions/setup-android@v3 fails here because it still asks
      # sdkmanager for the removed "tools" package, so install what this
      # project needs directly.
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "No preinstalled Android SDK at $SDK" >&2
            exit 1
          fi
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            MANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          fi
          yes | "$MANAGER" --licenses > /dev/null || true
          "$MANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build, test and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
